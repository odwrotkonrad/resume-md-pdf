# yaml-language-server: $schema=https://gitlab.com/konradodwrot/go-modules/-/raw/main/che/assets/data/che.schema.json
##[>] 🤖🤖
ontoRepo:
  options:
    autoDiscover: true
  include:
    renderTemplates:
      - source: "@gitlab.com/konradodwrot/cross-repo/misc?ref=${{ env.MISC_REF }}"
        chmod: "0755"
        options:
          skipAutoGeneratedHeader: true
        <<<:
          - source: //ci/semver-bump.zsh
            dest: ci/semver-bump.zsh
          - source: //ci/tag-mint.zsh
            dest: ci/tag-mint.zsh
      - source: "@gitlab.com/konradodwrot/cross-repo/prose/assets?ref=${{ env.PROSE_ASSETS_REF }}"
        options:
          skipAutoGeneratedHeader: true
        <<<:
          - source: //repos/resume-md-pdf/purpose.md
            dest: assets/docs-agents/purpose.md
          - source: //shared/license/LICENSE
            dest: LICENSE
          - dest: assets/data
            <<<:
              - source: //templates/2-data
                options:
                  skipAutoGeneratedHeader: false
                <<<:
                  - source: /makefile-agents.md.ontoRepo.tpl
                    dest: makefile.agents.md
                  - source: /repo-structure.md.ontoRepo.tpl
                    dest: repo-structure.md
          - source: //repos/resume-md-pdf/templates/3-audience
            options:
              skipAutoGeneratedHeader: false
            <<<:
              - source: /README.md.ontoRepo.tpl
                dest: README.md
              - source: /AGENTS.md.ontoRepo.tpl
                dest:
                  - CLAUDE.md
                  - path: AGENTS.md
                    options:
                      renderReferencedFiles: true

#[why] the repo declares the toolchain its dependency step needs, so no host or image has to carry
#   ruby in advance for this repo to prepare
devEnv:
  include:
    installPackages:
      - ruby
envSeed:
  include:
    renderTemplates:
      - source: .env.tpl
        dest:
          - path: .env
            options:
              writeType: mergeUpsert
##[<] 🤖🤖
