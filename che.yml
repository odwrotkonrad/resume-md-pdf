# yaml-language-server: $schema=https://gitlab.com/konradodwrot/go-modules/-/raw/main/che/assets/data/che.schema.json
##[>] 🤖🤖
ontoRepo:
  options: {autoDiscover: true}
  include:
    renderTemplates:
      - templates:
          - source: "@gitlab.com/konradodwrot/prose//repos/resume-md-pdf/purpose.md?ref=v0.0.1"
            dest:
              - {path: assets/docs-agents/purpose.md, options: {skipAutoGeneratedHeader: true}}
          - source: "@gitlab.com/konradodwrot/prose//conventions/conventions.md?ref=v0.0.1"
            dest:
              - {path: assets/data/conventions.md, options: {skipAutoGeneratedHeader: true}}
          - source: "@gitlab.com/konradodwrot/prose//templates/2-data/makefile-agents.md.ontoRepo.tpl?ref=v0.0.1"
            dest:
              - {path: assets/data/makefile.agents.md}
          - source: "@gitlab.com/konradodwrot/prose//templates/2-data/repo-structure.md.ontoRepo.tpl?ref=v0.0.1"
            dest:
              - {path: assets/data/repo-structure.md}
          - source: "@gitlab.com/konradodwrot/prose//shared/license/LICENSE?ref=v0.0.1"
            dest:
              - {path: LICENSE, options: {skipAutoGeneratedHeader: true}}
          - source: "@gitlab.com/konradodwrot/prose//repos/resume-md-pdf/templates/3-audience/AGENTS.md.ontoRepo.tpl?ref=v0.0.1"
            dest:
              - {path: CLAUDE.md}
              - {path: AGENTS.md, options: {renderReferencedFiles: true}}
          - source: "@gitlab.com/konradodwrot/prose//repos/resume-md-pdf/templates/3-audience/README.md.ontoRepo.tpl?ref=v0.0.1"
            dest:
              - {path: README.md}
##[<] 🤖🤖
