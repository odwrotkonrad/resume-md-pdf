workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

#[why] all CI runs on the self-hosted GKE runners: no SaaS compute minutes remain
#[why] a superseded pipeline holds pods for a commit nobody will merge: cancel it and let
#   the autoscaler release the node. jobs with an external side effect opt out individually
default:
  interruptible: true
  #[why] spot nodes are preempted mid-job and the manager itself runs on spot: infrastructure
  #   failures are expected, not exceptional. 2 is gitlab's hard maximum, so 3 attempts in total.
  #   retries cover runner and API faults only, never a failing script
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - unknown_failure
  tags:
    - gke-linux-amd64
  image: $ARTIFACT_REGISTRY_PROXY_DOCKERHUB/library/ruby:3.4
  before_script:
    - bundle install --quiet

stages:
  - build
  - validate
  - release

variables:
  ARTIFACT_REGISTRY: $GRP_KO_VAR_ARTIFACT_REGISTRY
  ARTIFACT_REGISTRY_PROXY_DOCKERHUB: $GRP_KO_VAR_ARTIFACT_REGISTRY_PROXY_DOCKERHUB
  OCI_IMAGES_CI_LINUX_REF: $GRP_KO_VAR_OCI_IMAGES_CI_LINUX_REF
  CHE_SCHEMA_REF: $GRP_KO_VAR_CHE_SCHEMA_REF
  PROSE_SPEC_REF: $GRP_KO_VAR_PROSE_SPEC_REF
  PROSE_ASSETS_REF: $GRP_KO_VAR_PROSE_ASSETS_REF
  MISC_REF: $GRP_KO_VAR_MISC_REF
  CI_IMAGE: $ARTIFACT_REGISTRY/ci-linux:$OCI_IMAGES_CI_LINUX_REF

validate-pre-commit-all:
  rules:
    - changes:
        - .gitlab-ci.yml
        - .env.tpl
        - che.yml
        - Makefile
        - lefthook.yml
        - .repo/*.tpl
        - .repo/deps-graph.yml
        - .repo/upstream.yml
        - .repo/upstream.env
        - scripts/**/*
        - validation/**/*
        - example/**/*
        - Gemfile
        - Gemfile.lock
        - README.md
  tags:
    - gke-linux-amd64-small
  stage: validate
  image: $CI_IMAGE
  needs: []
  before_script: []
  script:
    - make repo-ci-precommit-all
    - git diff --exit-code HEAD

build-pdf:
  rules:
    - changes:
        - scripts/**/*
        - example/**/*
        - Gemfile
        - Gemfile.lock
        - Makefile
        - .gitlab-ci.yml
  stage: build
  variables:
    BROWSER_PATH: /usr/bin/chromium
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends chromium fonts-liberation > /dev/null
    - bundle exec ruby scripts/build_pdf.rb example/styled_resume.md
  artifacts:
    expose_as: "resume pdf preview"
    paths:
      - example/styled_resume.pdf
    expire_in: 30 days

content-match:
  rules:
    - changes:
        - scripts/**/*
        - validation/**/*
        - example/**/*
        - Gemfile
        - Gemfile.lock
        - .gitlab-ci.yml
  tags:
    - gke-linux-amd64-small
  stage: validate
  needs: []
  script:
    - bundle exec ruby validation/test_content_match.rb
  artifacts:
    when: always
    paths:
      - validation/artifacts/styled_resume_stripped.md
      - validation/artifacts/diff.txt

pdf-assertions:
  rules:
    - changes:
        - scripts/**/*
        - validation/**/*
        - example/**/*
        - Gemfile
        - Gemfile.lock
        - .gitlab-ci.yml
  tags:
    - gke-linux-amd64-small
  stage: validate
  needs:
    - build-pdf
  script:
    - bundle exec ruby validation/test_pdf.rb

#[why] a merge to the default branch is the release event: mint the next semver tag so consumers can
#   pin a version instead of tracking a moving branch. tag only, no release object: nothing here ships
#   an artifact
tag-mint:
  tags:
    - gke-linux-amd64-small
  stage: release
  image: $CI_IMAGE
  #[why] the default before_script installs gems for the ruby image every other job runs on. this
  #   job runs on ci-linux, which carries no bundler, so it opts out rather than inheriting it
  before_script: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - scripts/**/*
        - validation/**/*
        - example/**/*
        - che.yml
        - Makefile
  variables:
    GIT_DEPTH: "0"
    TAG_TOKEN: $REPO_PROTECTED_VAR_BOT_TAG_TOKEN
  script:
    - make tag-mint

